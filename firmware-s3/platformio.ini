; esp32talking 固件 - LCDWIKI 2.8寸 ESP32-S3 模块适配版 (ES3C28P / ES3N28P)
; 板载: ILI9341V 2.8寸 IPS 屏(240x320) + 电容触摸 + ES8311 音频编解码
;       + FM8002E 功放(IO1 低电平使能) + MEMS 硅麦 + 16MB Flash + 8MB OPI PSRAM
; 协议与经典 ESP32 固件完全一致(WebSocket/ADPCM/话权/恢复码)。

[env:es3n28p]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    links2004/WebSockets@^2.4.1
    lovyan03/LovyanGFX@^1.1.16
